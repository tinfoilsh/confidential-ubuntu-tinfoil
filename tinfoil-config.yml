cvm-version: 0.14.8
cpus: 2
memory: 8192
gpus: 8

networks:
  dev:
    egress: open

volumes:
  - name: workspace
    exec: true

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-ubuntu-tinfoil-test@sha256:e29b68da5b0be2c438405765f142517d2b185231eed2195aa9bbfd582ab5beb4" # v0.2.0
    runtime: nvidia
    gpus: all
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]
    volumes: [workspace:/mnt/disk]

    ports: ["22:22"]

    env:
      - SSH_KEYS: |-
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDwPRs3ZguLD3xFvAdtQqjeRsUP9jCJ/6JXN9ruPJEhr cardno:22_545_924

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

shim:
  upstream-port: 22
  authenticated: false
