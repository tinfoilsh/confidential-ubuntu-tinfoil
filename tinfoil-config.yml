# Minimal workload for the boot-shim client-verification test. Nothing here is
# exercised beyond booting far enough to serve attestation, so the container is
# a static file server rather than the workspace image this repo normally ships.
cvm-version: 0.14.4
cpus: 2
memory: 4096

shim:
  upstream-port: 8080
  tls-mode: self-signed

containers:
  - name: "upstream"
    image: "docker.io/library/busybox@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8"
    restart: always
    tmpfs:
      /srv: "size=64k,mode=0755"
    command:
      - /bin/sh
      - -c
      - |
        printf 'igvm-boot-OK\n' > /srv/marker
        exec httpd -f -p 0.0.0.0:8080 -h /srv
